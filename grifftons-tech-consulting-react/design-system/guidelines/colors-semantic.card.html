<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Success, error, warning — each with its tint" -->
<link rel="stylesheet" href="../styles.css">

<style>
* {
  box-sizing:border-box;
}

body {
  margin:0;
  padding:22px 26px;
  background:var(--surface-page);
  font-family:var(--font-body);
}

.g {
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.sw {
  width:106px;
}

.chip {
  height:58px;
  border-radius:14px;
  border:1px solid rgba(7,6,7,.05);
}

.nm {
  margin-top:7px;
  font-size:11px;
  line-height:14px;
  letter-spacing:-.1px;
  color:var(--text-primary);
  font-weight:500;
}

.hx {
  font-size:10px;
  line-height:13px;
  color:var(--text-muted);
  text-transform:uppercase;
}
</style>

<div class="g">
  <div class="sw">
    <div class="chip" style="background:#1cb069"></div>
    <div class="nm">success</div>
    <div class="hx">#1cb069</div></div>
  <div class="sw">
    <div class="chip" style="background:#f1fdf7"></div>
    <div class="nm">success-tint</div>
    <div class="hx">#f1fdf7</div></div>
  <div class="sw">
    <div class="chip" style="background:#e14444"></div>
    <div class="nm">error</div>
    <div class="hx">#e14444</div></div>
  <div class="sw">
    <div class="chip" style="background:#fff3f3"></div>
    <div class="nm">error-tint</div>
    <div class="hx">#fff3f3</div></div>
  <div class="sw">
    <div class="chip" style="background:#ffe458"></div>
    <div class="nm">warning</div>
    <div class="hx">#ffe458</div></div>
  <div class="sw">
    <div class="chip" style="background:#fffae1"></div>
    <div class="nm">warning-tint</div>
    <div class="hx">#fffae1</div></div></div>
