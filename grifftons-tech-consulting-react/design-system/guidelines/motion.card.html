<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="0.25s on a soft out-curve. Lifts and fades only — no bounce" -->
<link rel="stylesheet" href="../styles.css">

<style>
* {
  box-sizing:border-box;
}

body {
  margin:0;
  padding:22px 26px;
  background:var(--surface-page);
  font-family:var(--font-body);
}

.g {
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.sw {
  width:106px;
}

.chip {
  height:58px;
  border-radius:14px;
  border:1px solid rgba(7,6,7,.05);
}

.nm {
  margin-top:7px;
  font-size:11px;
  line-height:14px;
  letter-spacing:-.1px;
  color:var(--text-primary);
  font-weight:500;
}

.hx {
  font-size:10px;
  line-height:13px;
  color:var(--text-muted);
  text-transform:uppercase;
}
</style>

<style>
.b {
  height:36px;
  border-radius:999px;
  background:var(--forest);
  animation:sl 2.6s infinite;
}

0%,8% {
  width:12%;
}

50%,58% {
  width:96%;
}

100% {
  width:12%;
}
</style>

<div style="display:grid;grid-template-columns:170px 1fr;gap:12px 20px;align-items:center;font-size:11px;color:var(--text-muted)">
  <div>
    ease-out · .25s
    </div>
  <div class="b" style="animation-timing-function:cubic-bezier(.22,1,.36,1)"></div>
  <div>
    ease-in-out
    </div>
  <div class="b" style="animation-timing-function:cubic-bezier(.65,0,.35,1)"></div>
  <div>
    ease-soft
    </div>
  <div class="b" style="animation-timing-function:cubic-bezier(.4,0,.2,1)"></div></div>
